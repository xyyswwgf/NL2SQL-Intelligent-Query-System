services:
  postgres:
    image: postgres:16
    container_name: data-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: data_agent
      POSTGRES_PASSWORD: Simple@123
      POSTGRES_DB: data_agent_db
    ports:
      - "15432:5432"
    volumes:
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_agent -d data_agent_db"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
